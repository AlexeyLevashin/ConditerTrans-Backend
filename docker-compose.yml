services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    networks: [backend]
    depends_on:
      redis:
        condition: service_healthy

  file-service:
    build:
      context: ./file-service
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    environment:
      NGINX_CONFIG_MODE: auto
    depends_on:
      - api
      - file-service
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/prod-conf.d:ro
      - ./nginx/conf.d.local:/etc/nginx/local-conf.d:ro
      - ./nginx/templates:/etc/nginx/bootstrap:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    command:
      - /bin/sh
      - -c
      - |
        rm -f /etc/nginx/conf.d/default.conf
        if [ "$$NGINX_CONFIG_MODE" = "local" ]; then
          cp /etc/nginx/local-conf.d/*.conf /etc/nginx/conf.d/
        elif [ -f /etc/letsencrypt/live/conditer-trans.ru/fullchain.pem ] && [ -f /etc/letsencrypt/live/conditer-trans.ru/privkey.pem ]; then
          cp /etc/nginx/prod-conf.d/*.conf /etc/nginx/conf.d/
        else
          cp /etc/nginx/bootstrap/*.conf /etc/nginx/conf.d/
        fi
        exec nginx -g 'daemon off;'
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q '^ok$'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  backend:

volumes:
  postgres_data:
  redis_data:
